name: iOS CI

on:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: macos-14 # iOS 17 시뮬레이터 런타임 포함
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Select iOS Simulator Runtime (>= 17.0)
        id: pick_ios
        shell: bash
        run: |
          set -euo pipefail

          MIN_IOS="17.0"

          # 설치된 iOS Simulator 런타임 버전들 추출 (예: 17.2, 18.0 ...)
          # 출력 포맷이 달라질 수 있어, "iOS <version>" 패턴에서 숫자만 뽑습니다.
          versions=()
          while IFS= read -r v; do
            versions+=("$v")
          done < <(
            xcrun simctl runtime list 2>/dev/null \
              | grep -Eo 'iOS ([0-9]+(\.[0-9]+)?)' \
              | awk '{print $2}' \
              | sort -V \
              | uniq
          )

          if [ "${#versions[@]}" -eq 0 ]; then
            echo "No iOS simulator runtimes detected." >&2
            exit 1
          fi

          # MIN_IOS 이상 중 가장 낮은 버전 선택 (우선 MIN_IOS)
          if printf '%s\n' "${versions[@]}" | grep -qx "$MIN_IOS"; then
            chosen="$MIN_IOS"
          else
            chosen=$(printf '%s\n' "${versions[@]}" | awk -v min="$MIN_IOS" '$0+0 >= min+0 {print}' | sort -V | head -n 1 || true)
          fi

          if [ -z "${chosen:-}" ]; then
            echo "No iOS runtime >= ${MIN_IOS} found. Available: ${versions[*]}" >&2
            exit 1
          fi

          echo "Detected runtimes: ${versions[*]:-<none>}"
          echo "Chosen iOS runtime version: $chosen"

          echo "ios_version=$chosen" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          IOS_VER="${{ steps.pick_ios.outputs.ios_version }}"

          # 스킴 목록 수집 (가장 짧은 이름 선택)
          SCHEMES_JSON=$(xcodebuild -list -json)
          SCHEMES=()
          while IFS= read -r s; do
            SCHEMES+=("$s")
          done < <(python3 -c 'import json, os; data=json.loads(os.environ["SCHEMES_JSON"]); schemes=data.get("workspace", {}).get("schemes") or data.get("project", {}).get("schemes") or []; print("\n".join(schemes))')

          if [ "${#SCHEMES[@]}" -eq 0 ]; then
            echo "No schemes found." >&2
            exit 1
          fi

          # 가장 짧은 이름(동일 길이면 사전순) 선택
          SCHEME=$(printf '%s\n' "${SCHEMES[@]}" | awk '{ print length, $0 }' | sort -n -k1,1 -k2,2 | head -n 1 | cut -d" " -f2-)

          echo "Detected schemes: ${SCHEMES[*]}"
          echo "Chosen scheme: $SCHEME"

          # 예시: 시뮬레이터 대상으로 빌드/테스트 시 destination에서 OS 지정
          xcodebuild \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,OS=${IOS_VER},name=iPhone 14" \
            build
