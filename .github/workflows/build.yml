name: iOS CI

on:
  pull_request:

env:
  SCHEME: DevLog

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: macos-14 # iOS 17 시뮬레이터 런타임 포함
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Select iOS Simulator Runtime (installed)
        id: pick_ios
        shell: bash
        run: |
          set -euo pipefail

          # iPhone 기기들만 모은 뒤, OS 버전(마이너 포함) 오름차순으로 가장 낮은 버전 선택
          RESULT=$(python3 - <<'PY'
          import json, re, subprocess, sys

          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "-j"], text=True))
          devices = data.get("devices", {})

          def is_available(d):
            return d.get("isAvailable") or d.get("availability") == "(available)"

          def runtime_to_version(runtime_key):
            # runtime 키가 아니라, 내부에서 OS 버전 문자열을 찾기 위해 fallback 사용
            # e.g., com.apple.CoreSimulator.SimRuntime.iOS-17-2 -> 17.2
            m = re.search(r'iOS-([0-9]+(?:-[0-9]+)*)', runtime_key)
            if not m:
              return None
            return m.group(1).replace('-', '.')

          def ver_key(v):
            return [int(x) for x in v.split('.')]

          candidates = []
          for runtime_key, devs in devices.items():
            for d in devs:
              if not is_available(d):
                continue
              if "iPhone" not in d.get("name", ""):
                continue
              ver = runtime_to_version(runtime_key)
              if not ver:
                continue
              candidates.append((ver_key(ver), ver, d["name"]))

          if not candidates:
            sys.exit(1)

          candidates.sort(key=lambda x: x[0])
          _, ver, name = candidates[0]
          print(f"{ver}|{name}")
          PY
          )

          if [ -z "${RESULT:-}" ]; then
            echo "No iPhone simulator devices detected." >&2
            exit 1
          fi

          IFS='|' read -r IOS_VER DEVICE_NAME <<< "$RESULT"

          echo "Chosen iOS runtime version (iPhone): $IOS_VER"
          echo "Chosen simulator: $DEVICE_NAME"

          echo "ios_version=$IOS_VER" >> "$GITHUB_OUTPUT"
          echo "device_name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          set -x
          IOS_VER="${{ steps.pick_ios.outputs.ios_version }}"
          DEVICE_NAME="${{ steps.pick_ios.outputs.device_name }}"

          xcodebuild -version

          echo "Using scheme: $SCHEME"

          echo "Using simulator: $DEVICE_NAME (iOS ${IOS_VER})"

          # 예시: 시뮬레이터 대상으로 빌드/테스트 시 destination에서 OS 지정
          set -o pipefail
          xcodebuild \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,OS=${IOS_VER},name=${DEVICE_NAME}" \
            -showBuildTimingSummary \
            build \
            | cat
