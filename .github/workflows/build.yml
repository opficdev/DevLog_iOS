name: iOS CI

on:
  pull_request:

env:
  SCHEME: DevLog

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Select iOS Simulator Runtime (installed)
        id: pick_ios
        shell: bash
        run: |
          set -euo pipefail

          # simctl 텍스트 헤더 버전 기준으로 최신 iOS 버전의 iPhone 선택
          echo "== simctl list devices =="
          xcrun simctl list devices

          RESULT=$(python3 - <<'PY'
          import re, subprocess, sys

          text = subprocess.check_output(["xcrun", "simctl", "list", "devices"], text=True)

          current_ver = None
          candidates = []  # (version_tuple, version_str, device_name)

          def ver_key(v):
            return tuple(int(x) for x in v.split('.'))

          for line in text.splitlines():
            m = re.match(r"^== iOS ([0-9]+(?:\.[0-9]+)*) ==$", line.strip())
            if m:
              current_ver = m.group(1)
              continue
            if "(unavailable)" in line:
              continue
            if current_ver and "iPhone" in line:
              name = line.strip()
              name = re.sub(r" \(.*", "", name)
              candidates.append((ver_key(current_ver), current_ver, name))

          if not candidates:
            print("No iPhone candidates found", file=sys.stderr)
            sys.exit(1)

          candidates.sort(reverse=True)
          _, ver, name = candidates[0]
          print(f"{ver}|{name}")
          PY
          )

          if [ -z "${RESULT:-}" ]; then
            echo "No iPhone simulator devices detected." >&2
            exit 1
          fi

          IFS='|' read -r IOS_VER DEVICE_NAME <<< "$RESULT"

          echo "Chosen iOS runtime version (iPhone): $IOS_VER"
          echo "Chosen simulator: $DEVICE_NAME"

          echo "ios_version=$IOS_VER" >> "$GITHUB_OUTPUT"
          echo "device_name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          set -x
          IOS_VER="${{ steps.pick_ios.outputs.ios_version }}"
          DEVICE_NAME="${{ steps.pick_ios.outputs.device_name }}"

          xcodebuild -version

          echo "Using scheme: $SCHEME"

          echo "Using simulator: $DEVICE_NAME (iOS ${IOS_VER})"

          # 예시: 시뮬레이터 대상으로 빌드/테스트 시 destination에서 OS 지정
          set -o pipefail
          xcodebuild \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,OS=${IOS_VER},name=${DEVICE_NAME}" \
            -showBuildTimingSummary \
            build \
            | cat