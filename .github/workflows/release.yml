name: iOS Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop'
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read release version
        id: release_version
        run: |
          version=$(ruby -e 'version = File.readlines("Application/Shared/Version.xcconfig").find { |line| line.match?(/\AMARKETING_VERSION\s*=/) }; abort("MARKETING_VERSION not found") if version.nil?; puts version.split("=", 2).last.strip')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.release_version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release already exists for ${{ steps.release_version.outputs.tag }}"
            exit 0
          fi

          gh release create "${{ steps.release_version.outputs.tag }}" \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "${{ steps.release_version.outputs.tag }}" \
            --generate-notes
